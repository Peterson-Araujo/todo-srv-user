spring:
  application:
    name: srv-user
  datasource:
    url: jdbc:postgresql://localhost:5432/srv-user
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true