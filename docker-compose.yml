services:
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: srv_user
    volumes:
      - data_srv_user:/var/lib/postgresql/data
    networks:
      - postgres-compose-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: peterson.araujo@gmail.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin27
    depends_on:
      - postgres
    networks:
      - postgres-compose-network

volumes:
  data_srv_user:

networks:
  postgres-compose-network:
    driver: bridge